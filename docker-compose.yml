services:
  helm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helm
    environment:
      # Database
      DATABASE_URL: sqlite+aiosqlite:///./data/helm.db
      # Secrets (must be set in .env)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      # AI provider (optional — at least one key needed for AI features)
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      # Server
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      SERVE_STATIC: "true"
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost,http://localhost:8000,http://localhost:5174}
      # Demo features
      DEMO_TIME_ALERTS: ${DEMO_TIME_ALERTS:-true}
    volumes:
      - helm-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  helm-data:
